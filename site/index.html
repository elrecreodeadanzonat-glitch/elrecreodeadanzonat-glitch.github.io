<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#F6EBDD" />
  <title>Libro de mamá</title>
  <meta name="description" content="Libro de mamá — estamos preparando algunos recuerdos muy especiales…" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='10' y='8' width='44' height='48' rx='6' fill='%23C8553D'/%3E%3Crect x='16' y='8' width='4' height='48' fill='%23A63F2C'/%3E%3Cpath d='M32 26c-3-4-9-2-8 3 1 4 8 8 8 8s7-4 8-8c1-5-5-7-8-3z' fill='%23F6EBDD'/%3E%3C/svg%3E" />
  <style>
    :root {
      --paper: #F6EBDD;
      --paper-deep: #EFDCC6;
      --ink: #3B2230;
      --ink-soft: #6E5160;
      --cover: #C8553D;
      --cover-deep: #A63F2C;
      --gold: #D9A441;
      --teal: #3E8A83;
      --rose: #E8998D;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background:
        radial-gradient(circle at 50% 28%, #FFF7EC 0%, var(--paper) 45%, var(--paper-deep) 100%);
      color: var(--ink);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
      display: grid;
      place-items: center;
      min-height: 100svh;
      padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      overflow: hidden;
    }
    main { text-align: center; max-width: 34rem; }
    .book {
      width: 150px; height: 196px; margin: 0 auto 36px; position: relative;
      transform-style: preserve-3d; perspective: 900px;
      animation: float 5s ease-in-out infinite;
    }
    .book .pages {
      position: absolute; inset: 6px 0 6px 10px; border-radius: 3px 10px 10px 3px;
      background: repeating-linear-gradient(90deg, #fffaf2 0 2px, #f0e3d0 2px 3px);
      box-shadow: 0 18px 30px -12px rgba(59, 34, 48, .35);
    }
    .book .cover {
      position: absolute; inset: 0; border-radius: 4px 12px 12px 4px;
      background: linear-gradient(135deg, var(--cover) 0%, var(--cover-deep) 100%);
      transform-origin: left center;
      animation: peek 5s ease-in-out infinite;
      box-shadow: inset 10px 0 0 rgba(0,0,0,.12), 0 20px 36px -14px rgba(59,34,48,.45);
      display: grid; place-items: center;
    }
    .book .cover::before {
      content: ""; position: absolute; inset: 14px 14px 14px 22px; border: 1.5px solid rgba(246,235,221,.55); border-radius: 6px;
    }
    .book .heart { width: 42px; height: 42px; }
    h1 {
      font-weight: 600; font-style: italic; letter-spacing: .01em;
      font-size: clamp(2.4rem, 9vw, 3.6rem); line-height: 1.05; margin: 0 0 14px;
    }
    p {
      font-size: clamp(1.05rem, 4.4vw, 1.3rem); line-height: 1.5; color: var(--ink-soft); margin: 0 auto;
    }
    .dots { display: flex; gap: 10px; justify-content: center; margin-top: 30px; }
    .dots span { width: 9px; height: 9px; border-radius: 50%; animation: pulse 1.8s ease-in-out infinite; }
    .dots span:nth-child(1) { background: var(--cover); }
    .dots span:nth-child(2) { background: var(--gold); animation-delay: .25s; }
    .dots span:nth-child(3) { background: var(--teal); animation-delay: .5s; }
    @keyframes float { 50% { transform: translateY(-8px); } }
    @keyframes peek { 0%, 55%, 100% { transform: rotateY(0deg); } 72% { transform: rotateY(-24deg); } }
    @keyframes pulse { 0%, 100% { transform: scale(.7); opacity: .5; } 50% { transform: scale(1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .book, .book .cover, .dots span { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="book" aria-hidden="true">
      <div class="pages"></div>
      <div class="cover">
        <svg class="heart" viewBox="0 0 32 32"><path d="M16 27s-10-6.2-10-13.2C6 9.6 9 7 12.3 7c1.7 0 3 .8 3.7 2 .7-1.2 2-2 3.7-2C23 7 26 9.6 26 13.8 26 20.8 16 27 16 27z" fill="#F6EBDD"/></svg>
      </div>
    </div>
    <h1>Libro de mamá</h1>
    <p>Estamos preparando algunos recuerdos muy especiales…</p>
    <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
  </main>
</body>
</html>
